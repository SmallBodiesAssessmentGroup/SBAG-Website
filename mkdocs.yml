site_name: Small Bodies Assessment Group (SBAG)
site_url: https://sbag.github.io/
site_description: >-
  The Small Bodies Assessment Group (SBAG) was established by NASA in March 2008
  to identify scientific priorities and opportunities for the exploration of
  asteroids, comets, interplanetary dust, small satellites, and Trans-Neptunian
  Objects.

theme:
  logo: assets/banner.png
  favicon: assets/square_banner.png
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - toc.integrate

nav:
